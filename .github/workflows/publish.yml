name: Publish to PyPI

# Triggers only on version tags (v0.1.0, v0.1.1, v1.0.0, etc.)
# Uses PyPI trusted publisher (OIDC) — no long-lived API token needed.
# Configure once at: https://pypi.org/manage/account/publishing/
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Verify pyproject version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MODULE=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\'](.+?)[\"\']', open('manav/_version.py').read()).group(1))")
          echo "tag=$TAG  pyproject=$PROJECT  module=$MODULE"
          if [ "$TAG" != "$PROJECT" ] || [ "$TAG" != "$MODULE" ]; then
            echo "::error::Tag / pyproject.toml / _version.py disagree — bump all three before tagging"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manav
    permissions:
      id-token: write  # required for OIDC → PyPI trusted publisher

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
