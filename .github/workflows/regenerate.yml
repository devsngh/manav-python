name: Regenerate SDK from OpenAPI

# Runs weekly + on-demand. Fetches the live openapi.json from prod,
# runs openapi-python-client to regenerate the low-level client under
# manav/_generated/, and opens a PR if anything changed.
#
# Not gated on the manav-python repo's push — the trigger is the
# BACKEND's public API changing, and this workflow's job is to notice.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  regenerate:
    name: Fetch openapi.json + regenerate + open PR on diff
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openapi-python-client
        run: pip install "openapi-python-client>=0.21.0"

      - name: Fetch openapi.json + regenerate
        run: |
          curl -fsS --max-time 30 https://api.manavagi.com/openapi.json -o openapi.json
          openapi-python-client generate --path openapi.json --overwrite --output-path manav/_generated || {
            echo "::warning::codegen failed — leaving repo unchanged"
            exit 0
          }

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sdk/regen-openapi
          commit-message: "chore(sdk): regenerate from openapi.json"
          title: "chore(sdk): regenerate low-level client from openapi.json"
          body: |
            Auto-generated by `.github/workflows/regenerate.yml`.

            Diff reflects backend API changes since the last regen.
            Review + merge to include in the next release.
          delete-branch: true
